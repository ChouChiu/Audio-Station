[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "audio-station"
version = "1.0.0"
description = "Reference-guided and neural vocal separation with a PySide6 Fluent UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Audio Station contributors" }]
dependencies = [
  "numpy>=2.0,<3",
  "onnxruntime>=1.20,<2",
  "PySide6>=6.8,<7",
  "PySide6-Fluent-Widgets[full]>=1.11.3,<2",
  "scipy>=1.14,<2",
  "soundfile>=0.13,<1",
  "soxr>=0.5,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.27",
  "pytest>=8.3,<10",
  "pytest-qt>=4.4,<5",
  "ruff>=0.12,<1",
]
deploy = ["nuitka==4.1.3", "ordered-set", "zstandard", "patchelf; sys_platform == 'linux'"]

[project.scripts]
audio-station = "entrypoints.cli:main"

[project.urls]
Documentation = "https://qfluentwidgets.com/"

[tool.hatch.build.targets.wheel]
packages = [
  "src/app",
  "src/entrypoints",
  "src/features",
  "src/resources",
  "src/shared",
]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "deployment",
  "README.md",
  "LICENSE",
  "pyproject.toml",
  "pysidedeploy.spec",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["slow: resource-intensive acceptance tests", "model: requires local ONNX weights"]

[tool.pyside6-project]
files = [
  "deployment/main.py",
  "src/app/__init__.py",
  "src/app/main_window.py",
  "src/app/full_stage_processing.py",
  "src/app/mr_workspace.py",
  "src/app/version.py",
  "src/app/worker.py",
  "src/entrypoints/__init__.py",
  "src/entrypoints/__main__.py",
  "src/entrypoints/cli.py",
  "src/entrypoints/gui.py",
  "src/features/__init__.py",
  "src/features/home/__init__.py",
  "src/features/home/page.py",
  "src/features/full_stage/__init__.py",
  "src/features/full_stage/matching.py",
  "src/features/full_stage/models.py",
  "src/features/full_stage/page.py",
  "src/features/neural_separation/__init__.py",
  "src/features/neural_separation/catalog.py",
  "src/features/neural_separation/inference.py",
  "src/features/neural_separation/models.py",
  "src/features/neural_separation/model_store.py",
  "src/features/neural_separation/page.py",
  "src/features/neural_separation/processing.py",
  "src/features/reference_removal/__init__.py",
  "src/features/reference_removal/dsp/__init__.py",
  "src/features/reference_removal/dsp/algorithms.py",
  "src/features/reference_removal/dsp/alignment.py",
  "src/features/reference_removal/finder.py",
  "src/features/reference_removal/models.py",
  "src/features/reference_removal/page.py",
