  "src/resources/__init__.py",
  "src/shared/__init__.py",
  "src/shared/audio/__init__.py",
  "src/shared/audio/io.py",
  "src/shared/config.py",
  "src/shared/dsp/__init__.py",
  "src/shared/dsp/spectral.py",
  "src/shared/i18n.py",
  "src/shared/logging.py",
  "src/shared/processing.py",
  "src/shared/ui/__init__.py",
  "src/shared/ui/cards.py",
  "src/shared/ui/combo_box.py",
  "src/shared/update.py",
